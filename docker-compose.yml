services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: librarydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d librarydb"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrator:
    build:
      context: .
      args:
        PROJECT: Library.DbMigrator
    command: Library.DbMigrator.dll
    environment:
      ConnectionStrings__librarydb: Host=postgres;Port=5432;Database=librarydb;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  service:
    build:
      context: .
      args:
        PROJECT: Library.Service
    command: Library.Service.dll
    environment:
      ConnectionStrings__librarydb: Host=postgres;Port=5432;Database=librarydb;Username=postgres;Password=postgres
      Kestrel__Endpoints__grpc__Url: http://0.0.0.0:5001
      Kestrel__Endpoints__http__Url: http://0.0.0.0:5002
    ports:
      - "5001:5001"
      - "5002:5002"
    depends_on:
      migrator:
        condition: service_completed_successfully

  api:
    build:
      context: .
      args:
        PROJECT: Library.Api
    command: Library.Api.dll
    environment:
      ASPNETCORE_HTTP_PORTS: 5080
      Services__library-service__grpc__0: http://service:5001
    ports:
      - "5080:5080"
    depends_on:
      - service
