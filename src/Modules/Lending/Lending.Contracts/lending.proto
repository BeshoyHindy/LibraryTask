syntax = "proto3";

package library.lending.v1;

option csharp_namespace = "Lending.Contracts.Grpc";

import "google/type/date.proto";

service LendingService {
  rpc BorrowBook(BorrowBookRequest) returns (Loan);
  rpc ReturnBook(ReturnBookRequest) returns (Loan);
  rpc GetLoan(GetLoanRequest) returns (Loan);
}

message BorrowBookRequest {
  int32 book_id = 1;
  int32 borrower_id = 2;
  google.type.Date borrowed_on = 3;
}

message ReturnBookRequest {
  int32 loan_id = 1;
  google.type.Date returned_on = 2;
}

message GetLoanRequest {
  int32 loan_id = 1;
}

message Loan {
  int32 loan_id = 1;
  int32 book_id = 2;
  int32 borrower_id = 3;
  google.type.Date borrowed_on = 4;
  optional google.type.Date returned_on = 5;
}
